<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.data.main_info.name | escape }} · {{ page.title | escape }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <meta name="author" content="{{ site.data.main_info.name | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="Saisai Ding · Protein Design &amp; Food Science">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="theme-color" content="#163e40">
  <link rel="icon" href="{{ '/static/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/static/site.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Saisai Ding, home">Saisai Ding<span aria-hidden="true">.</span></a>
      <nav aria-label="Main navigation">
        <a href="{{ '/#research' | relative_url }}">Research</a>
        <a href="{{ '/#publications' | relative_url }}">Publications</a>
        <a href="{{ '/#background' | relative_url }}">Background</a>
        <a href="{{ '/#contact' | relative_url }}">Contact</a>
      </nav>
    </div>
  </header>
  <main id="main" tabindex="-1">{{ content }}</main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© {{ 'now' | date: '%Y' }} Saisai Ding</p>
      <p>Built with Jekyll · <a href="https://github.com/SaaaaiDing/SaaaaiDing.github.io">Website source</a></p>
      <a href="#main">Back to top ↑</a>
    </div>
  </footer>
</body>
</html>
